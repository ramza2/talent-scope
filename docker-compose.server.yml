# TalentScope server stack for internal-network direct access.
#
# Required invocation pattern:
#   docker compose --env-file .env.server -f docker-compose.server.yml ...
#
# Only frontend publishes a host port. Backend, PostgreSQL, Redis, MinIO,
# worker, beat and one-shot tool containers stay on the private network.
# Frontend nginx continues to proxy /api/ to http://api:8000/api/.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      POSTGRES_PERF_DB: ${POSTGRES_PERF_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - internal

  minio-init:
    # Docker Hub minio/mc may be unavailable. MinIO's own build publishes the
    # client image to Quay as well, and that image is scratch-based (no /bin/sh),
    # so use MC_HOST_* credentials and invoke mc directly without a shell.
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      MC_NO_COLOR: "1"
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET}"]
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "-Q",
        "document,analysis,index",
        "-l",
        "info",
      ]
    networks:
      - internal

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "-l", "info"]
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TALENTSCOPE_BIND_IP}:${TALENTSCOPE_PORT}:80"
    networks:
      - internal

  # One-shot production migration runner. Internal-only; never publish a port.
  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.server
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - internal

  # Prepare isolated test/PERF databases. The test DB is recreated on every
  # tools run so interrupted/previous pytest sessions cannot leak rows into the
  # next regression. PERF is preserved unless it does not exist.
  tools-db-init:
    profiles: ["tools"]
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      POSTGRES_PERF_DB: ${POSTGRES_PERF_DB}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "${POSTGRES_TEST_DB}" in
          *_test*) ;;
          *) echo "Refusing to reset non-test DB: ${POSTGRES_TEST_DB}" >&2; exit 1 ;;
        esac
        psql -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${POSTGRES_TEST_DB}' AND pid <> pg_backend_pid();"
        dropdb --if-exists "${POSTGRES_TEST_DB}"
        createdb "${POSTGRES_TEST_DB}"

        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${POSTGRES_PERF_DB}'" | grep -q 1; then
          createdb "${POSTGRES_PERF_DB}"
        fi
    networks:
      - internal

  # One-shot server-side test runner. It uses a separate *_test database.
  # The repository bind mount stays read-only; dev extras are installed from
  # /app, which is the writable source tree baked into the disposable image.
  test:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    env_file:
      - .env.server
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_TEST_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: talentscope:test
      S3_ENDPOINT: http://minio:9000
      # Keep regression tests deterministic even when production embedding is
      # enabled in .env.server. Individual embedding tests opt in explicitly.
      EMBEDDING_ENABLED: "false"
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_MAX_INPUT_CHARS: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      tools-db-init:
        condition: service_completed_successfully
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace:ro
    command:
      [
        "sh",
        "-lc",
        "python -m pip install '/app[dev]' && alembic upgrade head && pytest -p no:cacheprovider",
      ]
    networks:
      - internal

  # One-shot PERF runner. Product DATABASE_URL and PERF_DATABASE_URL are kept
  # different so the benchmark script's destructive-write safety check remains active.
  perf:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.server
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PERF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_PERF_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      tools-db-init:
        condition: service_completed_successfully
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace:ro
      - ./artifacts:/artifacts
    command: ["python", "scripts/search_perf_benchmark.py", "--help"]
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
