name: Analysis v23 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-v23-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Focused analysis regression (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: talentscope
          POSTGRES_PASSWORD: talentscope
          POSTGRES_DB: talentscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentscope -d talentscope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply database migrations
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/talentscope
          REDIS_URL: redis://127.0.0.1:6379/0
        run: alembic upgrade head

      - name: Run v20-v23 focused regression
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/talentscope
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m pytest -q \
            tests/test_project_tech_supplement_v23.py \
            tests/test_profile_extract_v23.py \
            tests/test_profile_extract_v25.py \
            tests/test_profile_extract_v22.py \
            tests/test_project_relation_supplement_v20.py \
            tests/test_root_job_exp_project_relation_evidence.py \
            tests/test_multiline_project_owned_span.py \
            tests/test_project_date_backfill_v20.py \
            tests/test_project_date_reconciliation_v125.py \
            tests/test_analysis_token_budgeting.py \
            tests/test_openai_compat.py \
            tests/test_modelops_gateway_contract.py \
            tests/test_candidate_quality_guards.py \
            tests/test_kosa_scanned_tiled_recovery_v38.py \
            tests/test_kosa_section_boundary_v38.py \
            tests/test_education_cert_quality_guards.py \
            tests/test_employment_ongoing_date_confirm.py \
            tests/test_project_ongoing_date_confirm.py \
            tests/test_analysis_guard_refresh.py \
            tests/test_analysis_vlm_table_banding.py \
            tests/test_dashboard.py

      - name: Run NEW Diff evidence review regression
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/talentscope
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m pytest -q \
            tests/test_diff_evidence_bulk_guard.py \
            tests/test_analysis.py \
            -k "diff_evidence_bulk_guard or test_bulk_conflict_reject_and_foreign_diff"

      - name: Create and migrate V36 isolated database
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python <<'PY'
          from sqlalchemy import create_engine, text

          admin = create_engine(
              "postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with admin.connect() as conn:
              exists = conn.execute(
                  text(
                      "SELECT 1 FROM pg_database "
                      "WHERE datname = 'talentscope_v36_e2e'"
                  )
              ).scalar()
              if not exists:
                  conn.execute(
                      text(
                          "CREATE DATABASE talentscope_v36_e2e OWNER talentscope"
                      )
                  )

          db = create_engine(
              "postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/"
              "talentscope_v36_e2e",
              isolation_level="AUTOCOMMIT",
          )
          with db.connect() as conn:
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS pg_trgm"))
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS pgcrypto"))
          PY
          DATABASE_URL=postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/talentscope_v36_e2e \
            alembic upgrade head

      - name: Run V36 confirm→index E2E
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/talentscope_v36_e2e
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m pytest -q tests/test_analysis_confirm_index_e2e.py

  frontend-evidence:
    name: Diff evidence UI check (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Diff evidence guards
        run: npx --yes tsx --tsconfig tsconfig.app.json scripts/check-diff-evidence.ts

      - name: Build frontend
        run: npm run build
