name: Analysis v23 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-v23-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Focused analysis regression (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run v20-v23 focused regression
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+psycopg://talentscope:talentscope@127.0.0.1:5432/talentscope
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m pytest -q \
            tests/test_project_tech_supplement_v23.py \
            tests/test_profile_extract_v23.py \
            tests/test_profile_extract_v22.py \
            tests/test_project_relation_supplement_v20.py \
            tests/test_analysis_token_budgeting.py \
            tests/test_openai_compat.py \
            tests/test_modelops_gateway_contract.py \
            tests/test_candidate_quality_guards.py \
            tests/test_employment_ongoing_date_confirm.py
