server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS; refresh the API address after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        # Multipart upload (PDF+PPTX etc.); backend per-file max is 50MB.
        client_max_body_size 100m;
        # Variable upstream triggers runtime DNS lookup; preserves the /api/ URI.
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
