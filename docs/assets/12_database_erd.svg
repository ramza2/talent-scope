  <path class="line-dashed" d="M1565 680 L1565 1010"/>
  <text x="1576" y="735" class="label">confirm → job</text>

  <!-- Footer notes -->
  <text x="60" y="1295" class="note">Source of Truth: PERSON_PROFILE / PROJECT / code links. Candidate JSON은 ANALYSIS_RUN에 보관하며, SEARCH_INDEX_ITEM은 재생성 가능한 파생 데이터이다.</text>
</svg>